<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024"
     role="img" aria-labelledby="title desc">
  <title id="title">nextbrief monochrome mark</title>
  <desc id="desc">One-colour nextbrief mark: two rules and a check, in currentColor.</desc>

  <!-- Same geometry as nextbrief.svg with the sheet removed, so the
       silhouette can be checked in a single colour, without the palette
       carrying it. Inherits the colour from `color` on an ancestor. -->

  <rect x="256" y="192" width="544" height="64" rx="32" fill="currentColor"/>
  <rect x="256" y="320" width="384" height="64" rx="32" fill="currentColor"/>
  <path d="M256 640 L416 800 L800 416" fill="none" stroke="currentColor" stroke-width="128"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
