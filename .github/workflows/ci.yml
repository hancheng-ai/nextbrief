name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only by default. Any job that needs more asks for it explicitly, so a
# compromised action cannot quietly push to the repo.
permissions:
  contents: read

# A branch that gets three pushes in a minute should burn one runner, not three.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.11", "3.13"]
        exclude:
          # No arm64 CPython 3.9 exists in the setup-python manifest and
          # macos-latest is arm64. Rather than pin a retired x86 image to get
          # one, the macos-system-python job below tests the interpreter that
          # actually matters on macOS: /usr/bin/python3, which is 3.9 and is
          # what an unattended launcher with a minimal PATH will pick up.
          - os: macos-latest
            python: "3.9"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Show interpreter
        run: python -VV

      # Generated, not committed -- see examples/workspace/scripts/build-example.sh.
      # The suite builds it on demand too; doing it here as well keeps the failure
      # legible if the script itself breaks.
      - name: Build example workspace
        run: examples/workspace/scripts/build-example.sh

      # Installed, not run from the source tree: this is also the check that the
      # package is importable from an installed layout, not just from src/.
      - name: Install package
        run: python -m pip install --disable-pip-version-check .

      - name: Run tests
        run: python -m unittest discover -s tests -v

  macos-system-python:
    name: macOS system python (unattended path)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # No setup-python on purpose. The scheduled run is started by a GUI
      # launcher with a minimal PATH, so it gets /usr/bin/python3 and nothing
      # else. If the package stops working there, the nightly brief stops.
      - name: Show interpreter
        run: /usr/bin/python3 -VV

      - name: Build example workspace
        run: examples/workspace/scripts/build-example.sh

      - name: Run tests against the system interpreter
        run: PYTHONPATH=src /usr/bin/python3 -m unittest discover -s tests

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: python -m pip install --disable-pip-version-check "ruff>=0.6"
      - name: ruff check
        run: ruff check .

  package:
    name: build + twine check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: python -m pip install --disable-pip-version-check "build>=1.2" "twine>=5.0"

      - name: Build sdist and wheel
        run: python -m build

      - name: twine check
        run: twine check --strict dist/*

      # The pyproject job below reads intent; this reads the artifact that
      # actually ships. A build backend or a stray plugin could add a
      # Requires-Dist that never appeared in [project.dependencies].
      - name: Assert built metadata declares no runtime requirement
        run: |
          python - <<'PY'
          import pathlib, sys, zipfile

          wheels = sorted(pathlib.Path("dist").glob("*.whl"))
          if not wheels:
              sys.exit("no wheel was built")

          bad = []
          for whl in wheels:
              with zipfile.ZipFile(whl) as zf:
                  name = next(n for n in zf.namelist() if n.endswith(".dist-info/METADATA"))
                  meta = zf.read(name).decode("utf-8")
              for line in meta.splitlines():
                  if not line.startswith("Requires-Dist:"):
                      continue
                  # Extras are opt-in and do not affect `pip install nextbrief`.
                  if "; extra ==" in line or ";extra==" in line:
                      continue
                  bad.append("%s: %s" % (whl.name, line))

          if bad:
              sys.exit("wheel declares runtime dependencies:\n  " + "\n  ".join(bad))
          print("ok: no unconditional Requires-Dist in any wheel")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist-ci
          path: dist/

  zero-deps:
    name: zero runtime dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 3.11+ for tomllib. This job never runs on the floor version.
          python-version: "3.13"

      # The zero-dependency rule is the reason the nightly run survives being
      # launched by a GUI scheduler with a minimal PATH and a system Python.
      # It is load-bearing, so it is asserted rather than trusted.
      - name: Assert [project.dependencies] is empty
        run: |
          python - <<'PY'
          import sys, tomllib

          with open("pyproject.toml", "rb") as fh:
              cfg = tomllib.load(fh)

          project = cfg.get("project", {})
          deps = project.get("dependencies") or []
          if deps:
              sys.exit("nextbrief must have zero runtime dependencies, found: %r" % (deps,))

          # A dynamic dependency list would move the decision somewhere this
          # check cannot see it.
          if "dependencies" in (project.get("dynamic") or []):
              sys.exit("dependencies must not be dynamic -- it would defeat this check")

          print("ok: zero runtime dependencies")
          PY

  locales:
    name: locale catalogs agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # A missing key does not crash -- it prints an untranslated string, or a
      # key name, in someone's brief. That is exactly the kind of bug nobody
      # reports, so it is caught here instead.
      - name: Assert every catalog has the same key set
        run: |
          python - <<'PY'
          import pathlib, sys

          sys.path.insert(0, "src")
          from nextbrief.jsonc import load_jsonc

          def flatten(node, prefix=""):
              """Catalogs may be flat dotted keys or nested; compare them the same way."""
              out = set()
              for key, value in node.items():
                  path = prefix + key
                  if isinstance(value, dict):
                      out |= flatten(value, path + ".")
                  else:
                      out.add(path)
              return out

          root = pathlib.Path("src/nextbrief/locales")
          files = sorted(p for p in root.iterdir() if p.suffix in (".json", ".jsonc"))
          if len(files) < 2:
              sys.exit("expected at least the en and zh catalogs under %s" % root)

          keys = {p.stem: flatten(load_jsonc(p)) for p in files}
          reference = "en" if "en" in keys else sorted(keys)[0]
          baseline = keys[reference]

          problems = []
          for name in sorted(keys):
              if name == reference:
                  continue
              missing = sorted(baseline - keys[name])
              extra = sorted(keys[name] - baseline)
              if missing:
                  problems.append("%s is missing: %s" % (name, ", ".join(missing)))
              if extra:
                  problems.append("%s has keys %s does not: %s" % (name, reference, ", ".join(extra)))

          if problems:
              sys.exit("locale catalogs disagree\n  " + "\n  ".join(problems))
          print("ok: %d catalogs, %d keys each" % (len(keys), len(baseline)))
          PY

      # The step above only proves the catalogs agree with each other. The whole
      # CLI surface -- 57 keys -- was absent from both at once, and they agreed
      # perfectly the entire time: every string silently fell back to English
      # even under NEXTBRIEF_LOCALE=zh. So the catalogs are also checked against
      # the code that asks for keys.
      #
      # No `set +e` needed here: this step is one Python program, and a non-zero
      # exit from it is the failure signal, not an ordinary outcome.
      - name: Assert every key the code asks for exists in every catalog
        run: |
          python - <<'PY'
          import ast, pathlib, sys

          sys.path.insert(0, "src")
          from nextbrief.jsonc import load_jsonc

          def flatten(node, prefix=""):
              out = set()
              for key, value in node.items():
                  path = prefix + key
                  if isinstance(value, dict):
                      out |= flatten(value, path + ".")
                  else:
                      out.add(path)
              return out

          def referenced(src):
              """Literal keys passed to tr(cat, "key", ...) or cat.t("key", ...).

              Parsed, not grepped: a regex for `tr(` also matches the tail of
              `getattr(`, and an AST cannot be fooled that way. Keys selected
              through a variable are invisible here by construction, which is why
              the reverse direction below is a warning rather than a failure.
              """
              out = {}
              for path in sorted(src.rglob("*.py")):
                  tree = ast.parse(path.read_text(encoding="utf-8"))
                  for node in ast.walk(tree):
                      if not isinstance(node, ast.Call):
                          continue
                      func, args = node.func, node.args
                      if isinstance(func, ast.Name) and func.id == "tr" and len(args) >= 2:
                          key = args[1]
                      elif isinstance(func, ast.Attribute) and func.attr == "t" and args:
                          key = args[0]
                      else:
                          continue
                      if isinstance(key, ast.Constant) and isinstance(key.value, str):
                          out.setdefault(key.value, "%s:%d" % (path.name, node.lineno))
              return out

          root = pathlib.Path("src/nextbrief/locales")
          catalogs = {
              p.stem: flatten(load_jsonc(p))
              for p in sorted(root.iterdir())
              if p.suffix in (".json", ".jsonc")
          }
          used = referenced(pathlib.Path("src/nextbrief"))
          if not used:
              sys.exit("found no translated strings at all -- the scanner is broken")

          problems = []
          for name in sorted(catalogs):
              missing = sorted(k for k in used if k not in catalogs[name])
              if missing:
                  problems.append(
                      "%s.json is missing %d key(s) the code asks for:\n    %s"
                      % (name, len(missing), "\n    ".join("%s  (%s)" % (k, used[k]) for k in missing))
                  )
          if problems:
              sys.exit("catalogs do not cover the code\n  " + "\n  ".join(problems))

          # Reverse direction: a catalog key nobody references is untidy, never
          # broken, and a static scan cannot see keys chosen through a variable
          # (reminder.write_gate_no_git and reminder.write_gate_no_repo among
          # them). Reported, never fatal.
          everywhere = set.intersection(*catalogs.values()) if catalogs else set()
          orphans = sorted(everywhere - set(used))
          if orphans:
              print("::notice::%d catalog key(s) not referenced by any literal lookup: %s"
                    % (len(orphans), ", ".join(orphans)))
          print("ok: %d referenced key(s) present in all %d catalogs" % (len(used), len(catalogs)))
          PY

  no-leaks:
    name: no leaked identifiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # nextbrief was extracted from a private single-user workspace. Names,
      # hostnames and home paths from that workspace must never reappear -- not
      # in code, not in a doc, not in a test fixture, not in an example. This is
      # a standing guard rather than a one-time cleanup, because the leak that
      # matters is the one added six months from now by someone pasting a real
      # traceback into an issue-reproducing test.
      #
      # This file is excluded from its own scan: it necessarily spells out every
      # string it is looking for.
      - name: Scan tracked files for private-workspace identifiers
        run: |
          # errexit is deliberately OFF. GitHub runs `run:` steps under
          # `bash -e {0}`, and this whole check is built on git grep, which exits
          # 1 to mean "found nothing" -- the success case. Left on, the first
          # clean scan kills the script and the job fails with no output at all,
          # which looks exactly like a leak that cannot be located.
          set +e
          set -uo pipefail
          scan=':!.github/workflows/ci.yml'
          tmp="${RUNNER_TEMP:-/tmp}"
          status=0

          # git grep exits 0 on a hit, 1 on none, 2 on error. Treating "error"
          # as "clean" would turn this guard into decoration, so it is checked.
          scan_for() {
            local label="$1" out="$2"; shift 2
            git grep -nI "$@" -- . "$scan" > "$out"
            local rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "::error::$label"
              cat "$out"
              status=1
            elif [ "$rc" -ne 1 ]; then
              echo "::error::the identifier scan itself failed (git grep exit $rc)"
              status=1
            fi
          }

          # Pass 1 -- zero tolerance. Nothing here has a legitimate public use.
          # Short names are matched case-sensitively and on word boundaries so
          # that ordinary English ("median", "Italian") is safe.

          scan_for "private workspace identifiers or absolute home paths found" "$tmp/hits-private.txt" \
            -Ei -e '/Users/'

          # Pass 2 -- the maintainer's own published identity is allowed where a
          # package must carry it (authorship, repository URL) and nowhere else.
          # Filtering is line-based and deliberately narrow; anything else that
          # mentions the maintainer, a home path included, still fails above.
          git grep -nIEi -e 'hancheng' -- . "$scan" > "$tmp/hits-raw.txt"
          rc=$?
          if [ "$rc" -gt 1 ]; then
            echo "::error::the identifier scan itself failed (git grep exit $rc)"
            status=1
          fi
          # Each pattern is one place a package is *expected* to carry its
          # author's identity. Anything else that mentions the maintainer --
          # a home path, a private hostname, a pasted traceback -- still fails.
          grep -vE \
            -e 'github\.com/hancheng-ai/nextbrief' \
            -e 'hancheng-ai/homebrew-tap' \
            -e 'name = "Hancheng Wang", email = "wanghancheng\.ai@gmail\.com"' \
            -e 'Copyright \(c\) [0-9]{4} Hancheng Wang' \
            -e '^CITATION\.cff:[0-9]+: *(- )?(given-names: Hancheng|family-names: Wang|email: wanghancheng\.ai@gmail\.com)' \
            "$tmp/hits-raw.txt" > "$tmp/hits-owner.txt" || true
          if [ -s "$tmp/hits-owner.txt" ]; then
            echo "::error::maintainer identifier outside package metadata"
            cat "$tmp/hits-owner.txt"
            status=1
          fi

          if [ "$status" -eq 0 ]; then
            echo "ok: no leaked identifiers"
          else
            echo
            echo "Examples and fixtures must be fictional. See CONTRIBUTING.md."
          fi
          exit "$status"
