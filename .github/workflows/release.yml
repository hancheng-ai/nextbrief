name: Release

on:
  push:
    tags: ["v*"]

# The tag is the only trigger and the only input. Nothing here reads a secret:
# both indexes are reached through Trusted Publishing (OIDC), so there is no API
# token to leak, rotate, or forget to rotate.
permissions:
  contents: read

jobs:
  # A publish is permanent: an index accepts a version number once and never
  # again. CI runs the suite on every push to main, but a tag is not a push to
  # main -- it can point at any commit, and nothing here re-checked it. A tag
  # whose tests fail therefore published, which is exactly what happened to
  # v0.1.0rc2. This job is the gate that was missing; `build` waits on it.
  gate:
    name: tests and the privacy scan must pass before anything is published
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the privacy scan below reads every commit, and a
          # shallow clone would silently scan almost nothing and pass.
          fetch-depth: 0

      # First, because a release is the one push that cannot be walked back. A
      # tag builds an sdist, a wheel and a zipapp, uploads them to a package
      # index and attaches them to a public release; anything private in the
      # tree at that moment is published in four places at once, and a package
      # index version number can never be reused after deletion.
      #
      # CI runs this too. It runs here as well because CI failing does not stop
      # a release -- the two workflows are independent, and for several releases
      # this one published while that one was red.
      - name: Privacy scan
        env:
          NEXTBRIEF_PRIVATE_IDENTIFIERS: ${{ secrets.PRIVATE_IDENTIFIERS }}
        run: python3 scripts/privacy-scan.py --all

      - uses: actions/setup-python@v7
        with:
          # The floor, not the newest: a release must work on the oldest
          # interpreter the package claims to support.
          python-version: "3.9"

      - name: Build example workspace
        run: examples/workspace/scripts/build-example.sh

      - name: Run the full suite
        run: PYTHONPATH=src python -m unittest discover -s tests

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install ruff
        run: python -m pip install --disable-pip-version-check "ruff>=0.6"

      - name: ruff check
        run: ruff check .

      - name: Assert the version literals agree
        run: |
          python - <<'PY'
          import pathlib, re, sys, tomllib

          with open("pyproject.toml", "rb") as fh:
              pyproject = tomllib.load(fh)["project"]["version"]
          init = re.search(r'(?m)^__version__ = "([^"]+)"',
                           pathlib.Path("src/nextbrief/__init__.py").read_text(encoding="utf-8"))
          citation = re.search(r"(?m)^version: (.+)$",
                               pathlib.Path("CITATION.cff").read_text(encoding="utf-8"))
          if not init or not citation:
              sys.exit("could not find a version literal -- update this check")
          found = {
              "pyproject.toml": pyproject,
              "src/nextbrief/__init__.py": init.group(1),
              "CITATION.cff": citation.group(1).strip().strip('"'),
          }
          if len(set(found.values())) != 1:
              sys.exit("version literals disagree:\n  "
                       + "\n  ".join("%-28s %s" % kv for kv in found.items()))
          print("ok: every version literal says %s" % pyproject)
          PY

  build:
    name: build ${{ github.ref_name }}
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # provenance attestation
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # A tag that disagrees with pyproject.toml produces an artifact whose
      # filename and metadata say different things, and PyPI will happily accept
      # it -- once, permanently, under the wrong number. Cheaper to stop here.
      - name: Verify tag matches pyproject version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re, sys, tomllib

          tag = os.environ["TAG"]
          if not tag.startswith("v"):
              sys.exit("tag %r must start with 'v'" % tag)
          tag_version = tag[1:]

          with open("pyproject.toml", "rb") as fh:
              declared = tomllib.load(fh)["project"]["version"]

          if tag_version != declared:
              sys.exit(
                  "REFUSING TO RELEASE\n"
                  "  tag             : %s  (-> %s)\n"
                  "  pyproject.toml  : %s\n"
                  "Bump the version in pyproject.toml and retag, or delete the tag.\n"
                  "The tag must carry the PEP 440 normalized form: v1.2.0rc1, not v1.2.0-rc1."
                  % (tag, tag_version, declared)
              )

          # Any pre-release or dev segment routes to TestPyPI. Publishing an rc
          # to the real index is not undoable, so the routing is derived from
          # the version itself rather than from a checkbox someone has to tick.
          prerelease = bool(re.search(r"(a|b|rc)\d+|\.dev\d+", tag_version))

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("version=%s\n" % tag_version)
              out.write("prerelease=%s\n" % ("true" if prerelease else "false"))

          print("%s -> %s" % (tag_version, "TestPyPI" if prerelease else "PyPI"))
          PY

      - name: Install build tooling
        run: python -m pip install --disable-pip-version-check "build>=1.2" "twine>=5.0"

      - name: Build sdist and wheel
        run: python -m build

      # Runs before the zipapp lands in dist/: twine reads dist/* and a .pyz is
      # not a distribution it knows how to check.
      - name: twine check
        run: twine check --strict dist/*

      # Built from the same checkout with the stdlib, and smoke tested against
      # itself -- the script renders a real brief out of the archive, which is
      # the only way to catch a packaging change that leaves the bundled
      # locales and templates unreachable from inside a zip.
      - name: Build and smoke test nextbrief.pyz
        run: bash scripts/build-zipapp.sh

      # All three artifacts, attested together while they are still in one
      # directory. Attestation is by digest, so it survives the move below.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      # Two sets, because they have two audiences. dist/ must hold exactly what
      # PyPI accepts -- a .pyz or a checksum file in there makes the publish
      # action fail on a file nobody asked it to upload. release/ is what a
      # human downloads from the Releases page.
      - name: Assemble release assets
        run: |
          mkdir -p release
          cp dist/nextbrief-*.tar.gz dist/nextbrief-*.whl release/
          mv dist/nextbrief.pyz release/

          # Named rather than globbed: if the build ever stops producing one of
          # the three, this fails instead of quietly shipping a checksum file
          # that covers two.
          cd release
          sha256sum nextbrief-*.tar.gz nextbrief-*.whl nextbrief.pyz > SHA256SUMS
          cat SHA256SUMS

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ steps.version.outputs.version }}
          path: dist/

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.version.outputs.version }}
          path: release/

  # ---------------------------------------------------------------------------
  # Publishing is opt-in and OFF until Trusted Publishing is configured on both
  # indexes. Left ungated, these two jobs would fail on every tag and take the
  # release down with them, so a repository variable holds them back.
  #
  # To turn publishing on:
  #   1. PyPI and TestPyPI -> the project -> Publishing -> add a GitHub
  #      publisher: this owner and repo, workflow `release.yml`, environment
  #      `pypi` and `testpypi` respectively.
  #   2. This repo -> Settings -> Environments -> create `pypi` and `testpypi`.
  #   3. This repo -> Settings -> Secrets and variables -> Actions -> Variables
  #      -> New repository variable: name PUBLISH_PYPI, value true
  #
  # Unset, or set to anything but 'true', both jobs skip and a tag still
  # produces a complete GitHub Release with every artifact attached.
  # ---------------------------------------------------------------------------

  testpypi:
    name: publish to TestPyPI
    needs: build
    if: vars.PUBLISH_PYPI == 'true' && needs.build.outputs.prerelease == 'true'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/nextbrief
    permissions:
      id-token: write       # the only credential; nothing is read from secrets
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ needs.build.outputs.version }}
          path: dist/
      # Upstream ships its major version as a branch instead of a tag;
      # `release/v1` is this action's equivalent of the `@v4` pins above.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # Re-running a failed release job should be boring, and a TestPyPI
          # version is often uploaded after a partial earlier attempt.
          skip-existing: true

  pypi:
    name: publish to PyPI
    needs: build
    if: vars.PUBLISH_PYPI == 'true' && needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nextbrief
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ needs.build.outputs.version }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub Release
    needs: [build, testpypi, pypi]
    # At most one publish job runs, and with PUBLISH_PYPI off neither does.
    # Without always() this job would be skipped along with them -- which is the
    # entire point of the gate: shipping a release must not depend on PyPI.
    if: >-
      always() && needs.build.result == 'success'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # --generate-notes diffs against the previous tag

      - uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.build.outputs.version }}
          path: release/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          PYPI_ENABLED: ${{ vars.PUBLISH_PYPI }}
        run: |
          set -euo pipefail

          # The last cheap place to catch a truncated artifact: everything here
          # has been through an upload and a download since it was hashed.
          (cd release && sha256sum -c SHA256SUMS)

          # Quoted heredoc so nothing in the body is expanded -- it is full of
          # backticks and shell one-liners that must reach the reader intact.
          # The three placeholders are substituted afterwards.
          cat > notes.md <<'MD'
          ## Install

          ```sh
          uv tool install nextbrief==@VERSION@                  # from PyPI
          pipx install nextbrief==@VERSION@                     # from PyPI
          curl -fsSLO @REPO@/releases/download/@TAG@/nextbrief.pyz && chmod +x nextbrief.pyz
          ```

          `nextbrief.pyz` is the whole program in one file: Python 3.9 or newer and
          nothing else, no install step and no virtualenv. Run it where it landed with
          `./nextbrief.pyz init`, or drop it on your PATH as `nextbrief`.

          Verify what you downloaded:

          ```sh
          curl -fsSLO @REPO@/releases/download/@TAG@/SHA256SUMS && sha256sum -c SHA256SUMS
          ```
          MD
          sed -i -e "s|@VERSION@|$VERSION|g" -e "s|@TAG@|$TAG|g" -e "s|@REPO@|$REPO_URL|g" notes.md

          # Which of the three lines actually work today, said here rather than
          # discovered from a 404.
          if [ "${PYPI_ENABLED:-}" != "true" ]; then
            {
              echo
              echo "> Not on PyPI yet, so the first two lines will not resolve."
              echo "> Use the \`.pyz\`, or install from source."
            } >> notes.md
          fi

          flags=(--title "$TAG" --notes-file notes.md --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi

          # Re-running the workflow on an existing tag should update the release
          # rather than fail on it. `gh release view` exits nonzero when there is
          # none, which is the normal path -- hence the `if`, since GitHub runs
          # `run:` steps under `bash -e` and a bare call would end the step.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* "${flags[@]}"
          fi
