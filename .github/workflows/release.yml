name: Release

on:
  push:
    tags: ["v*"]

# The tag is the only trigger and the only input. Nothing here reads a secret:
# both indexes are reached through Trusted Publishing (OIDC), so there is no API
# token to leak, rotate, or forget to rotate.
permissions:
  contents: read

jobs:
  # A publish is permanent: an index accepts a version number once and never
  # again. CI runs the suite on every push to main, but a tag is not a push to
  # main -- it can point at any commit, and nothing here re-checked it. A tag
  # whose tests fail therefore published, which is exactly what happened to
  # v0.1.0rc2. This job is the gate that was missing; `build` waits on it.
  gate:
    name: tests must pass before anything is published
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # The floor, not the newest: a release must work on the oldest
          # interpreter the package claims to support.
          python-version: "3.9"

      - name: Build example workspace
        run: examples/workspace/scripts/build-example.sh

      - name: Run the full suite
        run: PYTHONPATH=src python -m unittest discover -s tests

      # Rule 7's harness, run by something other than a person remembering to.
      #
      # Here rather than in ci.yml because the two halves of "are these guards
      # real?" cost wildly different amounts. Whether every anchor still
      # resolves is a unit test -- TheMutationManifestStillPointsAtRealLines,
      # milliseconds, already on every push -- and that is the half that broke:
      # absolutising the README's links for PyPI moved a line one mutation was
      # anchored to, watch-red treats an unresolvable anchor as fatal and stops
      # rather than skipping, and the guards after it went unwatched for a
      # whole release while the suite stayed green.
      #
      # Whether each guard actually goes red is the other half: eighty-odd
      # mutations, each applied and reverted around a test run, and it changes
      # only when a guard does. Paying that on every push would buy an answer
      # to a question nobody asked; paying it on a tag buys it at the one
      # moment the answer is load-bearing, since a publish is permanent.
      #
      # --quick because the step above just ran the full suite on this exact
      # tree; watch-red says so in its own output rather than skipping quietly.
      # Exit 1 (a guard did not fail) fails this job as surely as exit 2 (the
      # harness could not be trusted). A guard that no longer catches anything
      # is not a lesser problem than one that cannot be applied -- it is the
      # same problem, further along.
      - name: Watch every guard fail
        run: PYTHONPATH=src python scripts/watch-red.py --quick

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install ruff
        run: python -m pip install --disable-pip-version-check "ruff>=0.6"

      - name: ruff check
        run: ruff check .

      - name: Assert the version literals agree
        run: |
          python - <<'PY'
          import pathlib, re, sys, tomllib

          with open("pyproject.toml", "rb") as fh:
              pyproject = tomllib.load(fh)["project"]["version"]
          init = re.search(r'(?m)^__version__ = "([^"]+)"',
                           pathlib.Path("src/nextbrief/__init__.py").read_text(encoding="utf-8"))
          citation = re.search(r"(?m)^version: (.+)$",
                               pathlib.Path("CITATION.cff").read_text(encoding="utf-8"))
          if not init or not citation:
              sys.exit("could not find a version literal -- update this check")
          found = {
              "pyproject.toml": pyproject,
              "src/nextbrief/__init__.py": init.group(1),
              "CITATION.cff": citation.group(1).strip().strip('"'),
          }
          if len(set(found.values())) != 1:
              sys.exit("version literals disagree:\n  "
                       + "\n  ".join("%-28s %s" % kv for kv in found.items()))
          print("ok: every version literal says %s" % pyproject)
          PY

  build:
    name: build ${{ github.ref_name }}
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # provenance attestation
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # A tag that disagrees with pyproject.toml produces an artifact whose
      # filename and metadata say different things, and PyPI will happily accept
      # it -- once, permanently, under the wrong number. Cheaper to stop here.
      - name: Verify tag matches pyproject version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re, sys, tomllib

          tag = os.environ["TAG"]
          if not tag.startswith("v"):
              sys.exit("tag %r must start with 'v'" % tag)
          tag_version = tag[1:]

          with open("pyproject.toml", "rb") as fh:
              declared = tomllib.load(fh)["project"]["version"]

          if tag_version != declared:
              sys.exit(
                  "REFUSING TO RELEASE\n"
                  "  tag             : %s  (-> %s)\n"
                  "  pyproject.toml  : %s\n"
                  "Bump the version in pyproject.toml and retag, or delete the tag.\n"
                  "The tag must carry the PEP 440 normalized form: v1.2.0rc1, not v1.2.0-rc1."
                  % (tag, tag_version, declared)
              )

          # Any pre-release or dev segment routes to TestPyPI. Publishing an rc
          # to the real index is not undoable, so the routing is derived from
          # the version itself rather than from a checkbox someone has to tick.
          prerelease = bool(re.search(r"(a|b|rc)\d+|\.dev\d+", tag_version))

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("version=%s\n" % tag_version)
              out.write("prerelease=%s\n" % ("true" if prerelease else "false"))

          print("%s -> %s" % (tag_version, "TestPyPI" if prerelease else "PyPI"))
          PY

      - name: Install build tooling
        run: python -m pip install --disable-pip-version-check "build>=1.2" "twine>=5.0"

      - name: Build sdist and wheel
        run: python -m build

      # Runs before the zipapp lands in dist/: twine reads dist/* and a .pyz is
      # not a distribution it knows how to check.
      - name: twine check
        run: twine check --strict dist/*

      # Built from the same checkout with the stdlib, and smoke tested against
      # itself -- the script renders a real brief out of the archive, which is
      # the only way to catch a packaging change that leaves the bundled
      # locales and templates unreachable from inside a zip.
      - name: Build and smoke test nextbrief.pyz
        run: bash scripts/build-zipapp.sh

      # All three artifacts, attested together while they are still in one
      # directory. Attestation is by digest, so it survives the move below.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      # Two sets, because they have two audiences. dist/ must hold exactly what
      # PyPI accepts -- a .pyz or a checksum file in there makes the publish
      # action fail on a file nobody asked it to upload. release/ is what a
      # human downloads from the Releases page.
      - name: Assemble release assets
        run: |
          mkdir -p release
          cp dist/nextbrief-*.tar.gz dist/nextbrief-*.whl release/
          mv dist/nextbrief.pyz release/

          # Named rather than globbed: if the build ever stops producing one of
          # the three, this fails instead of quietly shipping a checksum file
          # that covers two.
          cd release
          sha256sum nextbrief-*.tar.gz nextbrief-*.whl nextbrief.pyz > SHA256SUMS
          cat SHA256SUMS

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ steps.version.outputs.version }}
          path: dist/

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.version.outputs.version }}
          path: release/

  # ---------------------------------------------------------------------------
  # Publishing is opt-in and OFF until Trusted Publishing is configured on both
  # indexes. Left ungated, these two jobs would fail on every tag and take the
  # release down with them, so a repository variable holds them back.
  #
  # To turn publishing on:
  #   1. PyPI and TestPyPI -> the project -> Publishing -> add a GitHub
  #      publisher: this owner and repo, workflow `release.yml`, environment
  #      `pypi` and `testpypi` respectively.
  #   2. This repo -> Settings -> Environments -> create `pypi` and `testpypi`.
  #   3. This repo -> Settings -> Secrets and variables -> Actions -> Variables
  #      -> New repository variable: name PUBLISH_PYPI, value true
  #
  # Unset, or set to anything but 'true', both jobs skip and a tag still
  # produces a complete GitHub Release with every artifact attached.
  # ---------------------------------------------------------------------------

  testpypi:
    name: publish to TestPyPI
    needs: build
    if: vars.PUBLISH_PYPI == 'true' && needs.build.outputs.prerelease == 'true'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/nextbrief
    permissions:
      id-token: write       # the only credential; nothing is read from secrets
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ needs.build.outputs.version }}
          path: dist/
      # Upstream ships its major version as a branch instead of a tag;
      # `release/v1` is this action's equivalent of the `@v4` pins above.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # Re-running a failed release job should be boring, and a TestPyPI
          # version is often uploaded after a partial earlier attempt.
          skip-existing: true

  pypi:
    name: publish to PyPI
    needs: build
    if: vars.PUBLISH_PYPI == 'true' && needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nextbrief
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ needs.build.outputs.version }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub Release
    needs: [build, testpypi, pypi]
    # At most one publish job runs, and with PUBLISH_PYPI off neither does.
    # Without always() this job would be skipped along with them -- which is the
    # entire point of the gate: shipping a release must not depend on PyPI.
    if: >-
      always() && needs.build.result == 'success'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # --generate-notes diffs against the previous tag

      - uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.build.outputs.version }}
          path: release/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          PYPI_ENABLED: ${{ vars.PUBLISH_PYPI }}
        run: |
          set -euo pipefail

          # The last cheap place to catch a truncated artifact: everything here
          # has been through an upload and a download since it was hashed.
          (cd release && sha256sum -c SHA256SUMS)

          # Which index this version routes to, decided from the same output
          # the two publish jobs are keyed off -- so the notes cannot name an
          # index the artifacts did not go to. The rule, stated rather than
          # observed: a version carrying a pre-release segment routes to
          # TestPyPI, a final version routes to PyPI. Until this branch existed
          # both lines said "from PyPI" unconditionally, and on every candidate
          # they handed the reader `no matching distribution` -- the same
          # failure the 0.2.0rc4 plugin shipped with, from the same cause.
          #
          # TestPyPI is not on anyone's default path and no resolver will pick
          # a prerelease on its own, so its lines have to say both where the
          # version is and which one it is. Neither route needs an
          # --extra-index-url fallback: the package declares zero dependencies,
          # so there is nothing for the resolver to go looking for elsewhere.
          if [ "$PRERELEASE" = "true" ]; then
            INDEX_NAME="TestPyPI"
            UV_LINE='uv tool install --default-index https://test.pypi.org/simple/ "nextbrief==@VERSION@"'
            PIPX_LINE='pipx install --index-url https://test.pypi.org/simple/ "nextbrief==@VERSION@"'
            INDEX_NOTE='> This is a pre-release, so it is on [TestPyPI](https://test.pypi.org/project/nextbrief/) rather than PyPI. That is why the first two lines name an index and pin a version: a final release needs neither.'
          else
            INDEX_NAME="PyPI"
            UV_LINE='uv tool install nextbrief==@VERSION@'
            PIPX_LINE='pipx install nextbrief==@VERSION@'
            INDEX_NOTE='> This is a final release, so it is on [PyPI](https://pypi.org/project/nextbrief/) and needs no index URL. Candidates route to [TestPyPI](https://test.pypi.org/project/nextbrief/) instead.'
          fi

          # Quoted heredoc so nothing in the body is expanded -- it is full of
          # backticks and shell one-liners that must reach the reader intact.
          # The placeholders are substituted afterwards.
          cat > notes.md <<'MD'
          ## Install

          ```sh
          @UV_LINE@
          @PIPX_LINE@
          curl -fsSLO @REPO@/releases/download/@TAG@/nextbrief.pyz && chmod +x nextbrief.pyz
          ```

          @INDEX_NOTE@

          `nextbrief.pyz` is the whole program in one file: Python 3.9 or newer and
          nothing else, no install step and no virtualenv. Run it where it landed with
          `./nextbrief.pyz init`, or drop it on your PATH as `nextbrief`.

          Verify what you downloaded:

          ```sh
          curl -fsSLO @REPO@/releases/download/@TAG@/SHA256SUMS && sha256sum -c SHA256SUMS
          ```
          MD
          # Expression order matters: the two install lines carry an @VERSION@
          # of their own, and sed applies each -e to the pattern space in turn,
          # so they have to arrive before the version is substituted.
          #
          # No `sed -i`: the in-place flag takes a mandatory argument on BSD sed
          # and refuses one on GNU, so the form that works on this runner cannot
          # be executed anywhere else -- including by the test that reads this
          # step back and runs it. A temp file and a mv behave the same on both.
          sed -e "s|@UV_LINE@|$UV_LINE|g" \
              -e "s|@PIPX_LINE@|$PIPX_LINE|g" \
              -e "s|@INDEX_NOTE@|$INDEX_NOTE|g" \
              -e "s|@VERSION@|$VERSION|g" \
              -e "s|@TAG@|$TAG|g" \
              -e "s|@REPO@|$REPO_URL|g" \
              notes.md > notes.md.tmp && mv notes.md.tmp notes.md

          # Which of the three lines actually work today, said here rather than
          # discovered from a 404. Names the index this version routes to, for
          # the same reason the block above does: with publishing off a
          # candidate is missing from TestPyPI, not from PyPI.
          if [ "${PYPI_ENABLED:-}" != "true" ]; then
            {
              echo
              echo "> Not on $INDEX_NAME yet, so the first two lines will not resolve."
              echo "> Use the \`.pyz\`, or install from source."
            } >> notes.md
          fi

          flags=(--title "$TAG" --notes-file notes.md --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi

          # Re-running the workflow on an existing tag should update the release
          # rather than fail on it. `gh release view` exits nonzero when there is
          # none, which is the normal path -- hence the `if`, since GitHub runs
          # `run:` steps under `bash -e` and a bare call would end the step.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* "${flags[@]}"
          fi

  # ---------------------------------------------------------------------------
  # The Homebrew formula's `sha256` is the one version literal in this
  # repository that scripts/bump-version.sh cannot sweep: it belongs to an asset
  # that does not exist until the job above has built and published it. So the
  # formula's `version` moved on every bump and its digest did not, and the two
  # were meant to be rejoined by a second, manual commit.
  #
  # That commit was forgotten for 0.2.0rc1, rc2, rc3 and rc4 -- four consecutive
  # releases documenting a `brew install --build-from-source` that failed its
  # checksum on the first thing it did. It was forgotten because it is the only
  # step in a release that no script performs and no test could see: the digest
  # is sixty-four hex characters whether it is this release's or a year old.
  #
  # Nobody has to go and fetch it. It is already in SHA256SUMS, computed two
  # jobs ago and verified again before the release was created. This job reads
  # it from there and opens the rejoining commit as a pull request.
  # ---------------------------------------------------------------------------
  homebrew:
    name: formula digest PR
    needs: [build, github-release]
    # This `if` is what makes the job reachable at all. Observed on v0.2.0:
    # `build` succeeded, `github-release` succeeded, and this was still SKIPPED --
    # because a skip propagates transitively through the graph, and `always()`
    # rescues only the job that carries it, not the ones downstream of it.
    # `github-release` needs [build, testpypi, pypi] and uses always() to survive
    # whichever publish job did not run. That rescue does not reach here.
    #
    # It was not an edge case. Exactly one publish job ever runs -- testpypi on a
    # prerelease, pypi on a final, neither with publishing off -- so an upstream
    # job is ALWAYS skipped, so this job could never run on any release at all.
    # It was written, fixture-tested, and reviewed for whether it could break the
    # publish. Nobody asked whether it could execute.
    #
    # Both dependencies are named explicitly rather than reusing the
    # `!contains(needs.*.result, 'failure')` form above: this job pushes a branch
    # and opens a pull request, so it must run only when the release it describes
    # actually happened -- not merely when nothing failed.
    if: >-
      always() && needs.build.result == 'success'
      && needs.github-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write         # push the branch
      pull-requests: write    # open the PR
    env:
      VERSION: ${{ needs.build.outputs.version }}
      BRANCH: homebrew/v${{ needs.build.outputs.version }}
    steps:
      # The default branch, not the tag. The tag is where the artifact came
      # from; the formula that needs fixing is the one people clone.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/download-artifact@v8
        with:
          name: release-${{ needs.build.outputs.version }}
          path: release/

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Rewrite the formula's digest and its provenance line
        id: patch
        run: |
          python - <<'PY'
          import os, pathlib, re, sys

          version = os.environ["VERSION"]
          sdist = "nextbrief-%s.tar.gz" % version
          sums = pathlib.Path("release/SHA256SUMS").read_text(encoding="utf-8")

          # Parsed by filename rather than by line number: SHA256SUMS covers the
          # sdist, the wheel and the zipapp, and the wheel's digest is just as
          # much sixty-four hex characters as the right one is.
          digest = None
          for line in sums.splitlines():
              fields = line.split()
              # `sha256sum` writes "<digest>  <name>" and marks binary mode with
              # a leading '*' on the name.
              if len(fields) == 2 and fields[1].lstrip("*") == sdist:
                  digest = fields[0]
                  break
          if not digest or not re.fullmatch(r"[0-9a-f]{64}", digest):
              sys.exit("no usable %s digest in SHA256SUMS:\n%s" % (sdist, sums))

          path = pathlib.Path("packaging/homebrew/nextbrief.rb")
          before = path.read_text(encoding="utf-8")

          # The formula on the default branch must already name this version,
          # or the digest being written belongs to a different tarball than the
          # `url` beside it -- which is the failure this job exists to prevent,
          # not one to introduce from the other direction. It happens whenever a
          # tag is cut from something other than the tip: an old tag re-run, or
          # a release pushed after the next bump already landed.
          if 'version "%s"' % version not in before:
              sys.exit(
                  "REFUSING TO PATCH\n"
                  "  the default branch's formula does not say version %r.\n"
                  "  Releasing a tag the default branch has already moved past\n"
                  "  would pin this digest to somebody else's url. Fix the\n"
                  "  formula by hand, or re-run this after the branches agree."
                  % version)

          text, n = re.subn(r'(?m)^  sha256 "[0-9a-f]{64}"$',
                            '  sha256 "%s"' % digest, before, count=1)
          if n != 1:
              sys.exit("could not find the sha256 line -- update this job")

          # Rewritten together with the digest, always. This line is what makes
          # a stale digest visible to tests/test_docs_consistency.py, and a
          # digest updated without it is the same invisible drift wearing a
          # different mask.
          text, n = re.subn(r"(?m)^  # sha256-of: \S+$",
                            "  # sha256-of: %s" % version, text, count=1)
          if n != 1:
              sys.exit("could not find the `# sha256-of:` line -- update this job")

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("changed=%s\n" % ("false" if text == before else "true"))
              out.write("digest=%s\n" % digest)

          path.write_text(text, encoding="utf-8")
          print("%s\n  sha256-of: %s" % (digest, version))
          PY

      # A pull request opened with GITHUB_TOKEN does not trigger workflow runs
      # -- GitHub's own recursion guard -- so this PR arrives with no checks on
      # it, and the test that this change exists to satisfy would not run until
      # after somebody merged it. Run it here instead, against the patched tree,
      # so the PR is known-green before it is opened rather than after.
      - name: The docs-consistency guard, on the patched tree
        if: steps.patch.outputs.changed == 'true'
        run: PYTHONPATH=src python -m unittest discover -s tests -p "test_docs_consistency.py"

      - name: Open the pull request
        if: steps.patch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.patch.outputs.digest }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packaging/homebrew/nextbrief.rb
          git commit -m "chore(homebrew): rejoin the formula digest to $VERSION" \
                     -m "The sha256 of the $VERSION sdist, read from the release's own
          SHA256SUMS. Opened by the homebrew job in .github/workflows/release.yml,
          which is the step that used to be a manual commit and was skipped for
          0.2.0rc1 through rc4."

          # Force, and safely so: this branch is written by this job and nothing
          # else, and a re-run of the workflow on the same tag should replace it
          # rather than fail on a non-fast-forward.
          git push --force origin "HEAD:refs/heads/$BRANCH"

          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -qx OPEN; then
            echo "PR already open for $BRANCH; the push above updated it."
            exit 0
          fi

          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$BRANCH" \
            --title "chore(homebrew): rejoin the formula digest to $VERSION" \
            --body "\`packaging/homebrew/nextbrief.rb\` pinned \`$TAG\` in its
          \`url\` from the moment the version was bumped, but its \`sha256\` could not
          move until the sdist existed. It exists now:

              $DIGEST  nextbrief-$VERSION.tar.gz

          This sets the digest and the \`# sha256-of:\` line above it together, which
          is what lets \`tests/test_docs_consistency.py\` tell a current digest from a
          four-release-old one.

          Checks do not run on a pull request opened with \`GITHUB_TOKEN\`, so the
          guard in that file was run against this exact tree in the job that opened
          this PR."
