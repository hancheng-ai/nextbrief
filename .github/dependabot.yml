version: 2

# There is no pip ecosystem entry here, and that is the point: nextbrief has
# zero runtime dependencies, so there is nothing to keep patched. The only
# supply chain the project actually has is its GitHub Actions, and those hold a
# publishing identity, so they are the ones worth watching.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - ci
    groups:
      # One PR a week, not five. Actions move together and are reviewed together.
      actions:
        patterns: ["*"]
