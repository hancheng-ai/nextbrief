[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "nextbrief"
version = "0.3.0"
description = "A daily brief across every project you own — where each claim is checked against evidence before it is allowed to print."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Hancheng Wang", email = "wanghancheng.ai@gmail.com" }]
keywords = [
    "project-management", "cli", "llm", "agents", "claude", "briefing",
    "hallucination", "evidence", "productivity", "gtd",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Office/Business :: Scheduling",
    "Typing :: Typed",
]

# Zero runtime dependencies, on purpose. The nightly job is launched by a GUI
# scheduler with a minimal PATH and must work under the system Python.
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2", "twine>=5.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/hancheng-ai/nextbrief"
Repository = "https://github.com/hancheng-ai/nextbrief"
Issues = "https://github.com/hancheng-ai/nextbrief/issues"
Changelog = "https://github.com/hancheng-ai/nextbrief/blob/main/CHANGELOG.md"

[project.scripts]
nextbrief = "nextbrief.cli:main"
# A short alias, because this is a tool you type every day and `nextbrief do
# NA-0004` is a lot of keystrokes for a habit.
#
# Note for anyone who also uses xwmx/nb, the note-taking CLI: both install a
# command called `nb`, and whichever is installed second wins. If you have it,
# install nextbrief with `pipx install --suffix @nx nextbrief` or drop this
# entry point locally; `nextbrief` itself is always available either way.
nb = "nextbrief.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nextbrief"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "examples/", "README.md", "README.zh.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "E501",
    # Percent formatting is used throughout, deliberately. The floor is 3.9 and
    # the code is stdlib-only by contract, so there is nothing to gain from
    # f-strings here, while converting ~390 call sites would be a large diff
    # through the evidence and rendering paths for no behavioural change.
    # Consistency is worth more than the idiom: one style, applied everywhere.
    "UP031",
    "UP032",
    # PEP 585/604 typing (list[str], X | None) reads better but is 3.10 syntax.
    # It happens to work at 3.9 here only because every module carries
    # `from __future__ import annotations`, which makes annotations lazy. Relying
    # on that across ~260 sites means the floor is held up by an import that is
    # easy to omit in a new file, and the failure would be a runtime TypeError on
    # the oldest interpreter -- the one the unattended launcher uses, and the one
    # least likely to be what a contributor is running. Explicit typing imports
    # cost nothing and cannot break that way.
    "UP006",
    "UP035",
    "UP045",
]
